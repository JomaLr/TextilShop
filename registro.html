<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | TextilShop</title>
    <link rel="stylesheet" href="registro.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2: diálogos y avisos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="ui.js"></script>
    <!-- Se corrigió la etiqueta de cierre faltante aquí -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link rel="stylesheet" href="tema.css" />
    <script src="tema.js" defer></script>
    <link rel="stylesheet" href="accesibilidad.css">
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">TextilShop</a>
      </nav>
    </header>
    <div class="register-container">
      <!-- FORMULARIO -->
      <div class="register-form">
        <div class="form-box">
          <h2>Crear Cuenta</h2>
          <form id="formulario_registro">
            <div class="input-group">
              <label>Nombre</label>
              <input
                id="user"
                type="text"
                placeholder="Ingresa tu nombre"
                required
              />
            </div>
            <div class="input-group">
              <label>Correo electrónico</label>
              <input
                id="email"
                type="email"
                placeholder="Ingresa tu correo"
                required
              />
            </div>
            <div class="input-group">
              <label>Contraseña</label>
              <input
                id="password"
                type="password"
                placeholder="Crea una contraseña"
                required
              />
            </div>
            <button type="submit">Registrarse</button>
          </form>
          <div class="extra-links">
            <p>
              ¿Ya tienes cuenta?
              <a href="login.html">Iniciar sesión</a>
            </p>
            <br /><br />
            <a href="index.html" title="Volver al inicio">
               << Volver a la tienda
            </a>
          </div>
        </div>
      </div>

      <!-- IMAGEN -->
      <div class="register-image">
        <div class="overlay">
          <h1>Únete a TextilShop</h1>
          <p>
            Regístrate y descubre las mejores prendas modernas para complementar
            tu estilo.
          </p>
        </div>
      </div>
    </div>
    <script src="register.js" defer></script>
    <script src="accesibilidad.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos | Dashboard</title>

    <link rel="stylesheet" href="admin-productos.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="verified_sesion.js"></script>
    <script src="admin-productos.js" defer></script>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <a href="index.html">
          <div class="logo">TextilShop</div>
        </a>
        <ul class="menu">
          <li>
            <a href="dashboard.html">Resumen</a>
          </li>
          <li class="active">
            <a>Productos</a>
          </li>
          <li>
            <a href="admin-categorias.html">Categorías</a>
          </li>
          <li>
            <a href="admin-inventario.html">Inventario</a>
          </li>
        </ul>
      </aside>

      <!-- CONTENIDO -->
      <main class="main-content">
        <!-- HEADER -->
        <div class="top-bar">
          <div>
            <h1>Productos</h1>

            <p>Administra los productos de la tienda</p>
          </div>

          <button id="agregar_prod" class="add-btn">+ Agregar Producto</button>
        </div>

        <dialog id="formModal">
          <form method="dialog">
            <h2>Nuevo producto</h2>

            <div class="form-group">
              <label>Nombre:</label>
              <input
                id="nombre_prod"
                placeholder="Nombre"
                required
              ></input>
            </div>

            <div class="form-group">
            <label>Descripcion:</label>
            <textarea
              id="descripcion_prod"
              rows="5"
              placeholder="Breve descripcion"
              required
            ></textarea>
          </div>

            <div class="form-group">
              <label>Precio:</label>
              <input
                type="number"
                id="precio_prod"
                placeholder=Precio"
                required
              />
            </div>

            <div class="form-group">
              <label>Talla:</label>
              <select id="talla_box" required>
                <option disabled selected>Selecciona una talla</option>
                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
              </select>
            </div>            

            <div class="form-group">
              <label>Categoría:</label>
              <select id="select_categoria" required>
                <option value="" disabled selected>Selecciona una categoría</option>
              </select>
            </div>

            <div class="form-group">
              <label for="foto_prod">Selecciona la imagen del producto:</label>
              <input
                type="file"
                id="foto_prod"
                accept="image/png, image/jpeg, image/jpg"
                required
              />
            </div>


            <div class="form-actions">
              <button type="button" id="closeModalBtn" class="btn-secondary">
                Cancelar
              </button>
              <button type="submit" class="btn-primary">Enviar</button>
            </div>
          </form>
        </dialog>

<dialog id="editModal">
  <form method="dialog">
    <h2>Editar Producto</h2>

    <input type="hidden" id="id_prod_edit" />

    <div class="form-group">
      <label>Nombre:</label>
      <input id="nombre_prod_edit" required />
    </div>

    <div class="form-group">
      <label>Descripcion:</label>
      <textarea id="descripcion_prod_edit" rows="5" required></textarea>
    </div>

    <div class="form-group">
      <label>Precio:</label>
      <input type="number" id="precio_prod_edit" required />
    </div>

    <div class="form-group">
      <label>Talla:</label>
      <select id="talla_box_edit" required>
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
      </select>
    </div>

    <div class="form-group">
      <label>Categoría:</label>
      <select id="select_categoria_edit" required>
        </select>
    </div>

    <div class="form-group">
      <label>Imagen del producto (Dejar vacío si no deseas cambiarla):</label>
      <input type="file" id="foto_prod_edit" accept="image/png, image/jpeg, image/jpg" />
    </div>

    <div class="form-actions">
      <button type="button" id="closeEditModalBtn" class="btn-secondary">Cancelar</button>
      <button type="submit" class="btn-primary">Guardar Cambios</button>
    </div>
  </form>
</dialog>

        <!-- TABLA -->
        <section class="table-section">
          <table>
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Talla</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Descripcion</th>
                <th>Acciones</th>
              </tr>
            </thead>
            
            <tbody id="tabla-productos-body"></tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil | TextilShop</title>
    <link rel="stylesheet" href="perfil.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="verified_sesion.js"></script>
    <script src="perfil.js" defer></script>
  </head>
  <body>
    <!-- NAVBAR -->
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo"> TextilShop </a>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="tienda.html?categoria=Novedades">Novedades</a></li>
          <li>
            <a href="tienda.html?categoria=Tendencias">Tendencias</a>
          </li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>

        <div class="nav-icons">
          <a href="dashboard.html" id="admin_panel"></a>
          <a href="#" id="logout">Cerrar sesión</a>
          <a href="carrito.html">🛒</a>
        </div>
      </nav>
    </header>

    <!-- PERFIL -->
    <section class="profile-section">
      <!-- INFO -->
      <div class="profile-card">
        <div class="profile-header">
          <div>
            <h1 id="username">Cargando...</h1>
            <p id="email_user">Cargando...</p>
          </div>
        </div>
        <div class="profile-info">
          <div class="info-box">
            <h3>Dirección</h3>
            <p id="direccion_user">Cargando...</p>
          </div>
          <div class="info-box">
            <h3>Teléfono</h3>
            <p id="telefono_user">Cargando...</p>
          </div>
          <div class="info-box">
            <button id="info_update" class="info_update">
              Actualizar mi Informacion
            </button>
          </div>
        </div>
      </div>

      <dialog id="formModal">
        <form method="dialog">
          <h2>Actualizar mi Información</h2>

          <div class="form-group">
            <label for="Direccion">Mi dirrección:</label>
            <textarea
              id="mi_direccion"
              name="mi_direccion"
              rows="5"
              placeholder="Escribe tu direccion"
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="telefono">Telefono:</label>
            <input
              type="number"
              id="mi_telefono"
              name="mi_telefono"
              placeholder="Escribe tu telefono"
              required
            />
          </div>

          <div class="form-actions">
            <button type="button" id="closeModalBtn" class="btn-secondary">
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Enviar</button>
          </div>
        </form>
      </dialog>

      <!-- COMPRAS -->
      <div class="orders-section">
        <h2>Mis Compras</h2>

        <div id="contenedor-pedidos"></div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer>
      <p>© 2026 TextilShop | Todos los derechos reservados</p>
    </footer>
  </body>
</html>

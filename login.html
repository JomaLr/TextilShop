<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | TextilShop</title>

    <!-- Aplica el tema guardado antes de pintar (evita parpadeo blanco) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tema");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="login.css" />
    <!-- tema.css va DESPUÉS de login.css para poder sobrescribirlo -->
    <link rel="stylesheet" href="tema.css" />

    <!-- Librería para la conexión a la DB -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js" defer></script>
    <script src="tema.js" defer></script>
    <script src="accesibilidad.js"></script> 
    <link rel="stylesheet" href="accesibilidad.css">
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">TextilShop</a>
        <!-- tema.js agrega aquí el botón de modo oscuro -->
      </nav>
    </header>

    <div class="login-container">
      <div class="login-image">
        <div class="overlay">
          <h1>Bienvenido a TextilShop</h1>

          <p>Descubre las mejores tendencias de moda moderna y elegante.</p>
        </div>
      </div>

      <!-- FORMULARIO -->
      <div class="login-form">
        <div class="form-box">
          <h2>Iniciar Sesión</h2>

          <form id="formulario_login">
            <div class="input-group">
              <label for="email">Correo electrónico</label>
              <input
                id="email"
                type="email"
                placeholder="Ingresa tu correo"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Contraseña</label>
              <input
                id="password"
                type="password"
                placeholder="Ingresa tu contraseña"
                required
              />
            </div>

            <button type="submit">Ingresar</button>
          </form>

          <div class="extra-links">
            <p>
              ¿No tienes cuenta?
              <a href="registro.html">Registrarse</a><br /><br />
              <a href="index.html" title="Volver al inicio">
                &lt;&lt; Volver a la tienda
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

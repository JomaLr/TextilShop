<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorías | Dashboard</title>

    <link rel="stylesheet" href="admin-categorias.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="verified_sesion.js"></script>
    <script src="admin_categorias.js" defer></script>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <a href="index.html">
          <div class="logo">TextilShop</div>
        </a>
        <ul class="menu">
          <li>
            <a href="dashboard.html">Resumen</a>
          </li>
          <li>
            <a href="admin-productos.html">Productos</a>
          </li>
          <li class="active">
            <a>Categorías</a>
          </li>
          <li>
            <a href="admin-inventario.html">Inventario</a>
          </li>
        </ul>
      </aside>

      <!-- CONTENIDO -->
      <main class="main-content">
        <!-- HEADER -->
        <div class="top-bar">
          <div>
            <h1>Categorías</h1>

            <p>Administra las categorías de la tienda</p>
          </div>

          <button id="info_update" class="add-btn">+ Nueva Categoría</button>
        </div>

        <!-- MODAL-->
        <dialog id="formModal">
          <form method="dialog">
            <h2>Agregar categoria</h2>

            <div class="form-group">
              <label for="cat">Nombre de la categoria:</label>
              <input type="text" id="cate" placeholder="Nombre" required />
            </div>

            <div class="form-group">
              <label for="foto_prod"
                >Agrega una imagen para la categoria:</label
              >
              <input
                type="file"
                id="foto_prod"
                accept="image/png, image/jpeg, image/jpg"
                required
              />
            </div>

            <div class="form-actions">
              <button type="button" id="closeModalBtn" class="btn-secondary">
                Cancelar
              </button>
              <button type="submit" class="btn-primary">Crear categoria</button>
            </div>
          </form>
        </dialog>

        <!-- MODAL DE edición-->
        <dialog id="editCatModal">
          <form method="dialog">
            <h2>Editar categoría</h2>

            <input type="hidden" id="id_cat_edit" />

            <div class="form-group">
              <label for="cate_edit">Nombre de la categoria:</label>
              <input type="text" id="cate_edit" placeholder="Nombre" required />
            </div>

            <div class="form-group">
              <label for="foto_cat_edit"
                >Modificar imagen (Dejar vacío para conservar la actual):</label
              >
              <input
                type="file"
                id="foto_cat_edit"
                accept="image/png, image/jpeg, image/jpg"
              />
            </div>

            <div class="form-actions">
              <button
                type="button"
                id="closeEditCatModalBtn"
                class="btn-secondary"
              >
                Cancelar
              </button>
              <button type="submit" class="btn-primary">Guardar Cambios</button>
            </div>
          </form>
        </dialog>

        <!-- TABLA -->
        <section class="table-section">
          <table>
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Categoría</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-categorias-body"></tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>

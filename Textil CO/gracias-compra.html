<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compra Exitosa | TextilShop</title>

    <link rel="stylesheet" href="gracias-compra.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="verified_sesion.js"></script>
    <script src="gracias-compra.js"></script>
  </head>
  <body>
    <!-- SECTION -->
    <section class="success-section">
      <div class="success-container">
        <!-- ICON -->
        <div class="success-icon">✔</div>

        <!-- TEXT -->
        <span class="tag"> Pedido confirmado </span>

        <h1>¡Gracias por tu compra!</h1>

        <p>
          Tu pedido fue procesado correctamente. Hemos enviado los detalles de
          tu compra a tu correo electrónico.
        </p>

        <!-- INFO -->
        <div class="order-info">
          <div class="info-card">
            <h3>Número de pedido</h3>
            <span id="ticket-numero">#00000</span>
          </div>

          <div class="info-card">
            <h3>Entrega estimada</h3>
            <span>3 - 5 días hábiles</span>
          </div>
        </div>

        <div class="buttons">
          <a href="perfil.html" class="primary-btn"> Ver mis pedidos </a>

          <a href="index.html" class="secondary-btn"> Seguir comprando </a>
        </div>
      </div>
    </section>
  </body>
</html>

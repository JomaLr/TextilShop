      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="verlogin.js"></script>
    <script src="pago.js" defer></script>
  </head>
  <body>
    <!-- NAVBAR -->
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo"> TextilShop </a>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="tienda.html?categoria=Novedades">Novedades</a></li>
          <li>
            <a href="tienda.html?categoria=Tendencias">Tendencias</a>
          </li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
        <div class="nav-icons">
          <a href="login.html" id="logearse">Login</a>
          <a href="carrito.html">🛒</a>
        </div>
      </nav>
    </header>

    <!-- CONTENIDO -->
    <section class="payment-section">
      <!-- FORMULARIO -->
      <div class="payment-form">
        <h1>Finalizar Compra</h1>

        <!-- DIRECCION -->
<div class="form-container">
  <h2>Dirección de envío</h2>

  <div class="input-group">
    <label>Nombre completo</label>
    <input type="text" id="input-nombre" placeholder="Ingresa tu nombre" />
  </div>

  <div class="input-group">
    <label>Dirección</label>
    <input type="text" id="input-direccion" placeholder="Calle y número" />
  </div>

  <div class="double-input"></div>
</div>

<div class="payment-summary">
  <h2>Resumen del pedido</h2>

  <div id="lista-productos-pago">
    </div>

  <div class="summary-details">
    <div>
      <p>Subtotal</p>
      <span id="pago-subtotal">$0 MXN</span>
    </div>

    <div>
      <p>Envío</p>
      <span id="pago-envio">$150 MXN</span> </div>

    <div class="total">
      <p>Total</p>
      <span id="pago-total">$0 MXN</span>
    </div>
  </div>

  <button id="btn-confirmar-compra">Confirmar Compra</button>
</div>
    </section>

    <!-- FOOTER -->
    <footer>
      <p>© 2026 TextilShop | Todos los derechos reservados</p>
    </footer>
